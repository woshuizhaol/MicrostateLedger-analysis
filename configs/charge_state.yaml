stats:
  ph: 7.4
  seed: 20261016
  n_boot: 10000
  alpha: 0.05
  threads: 40
agreement:
  methods:
  - naive
  - dimorphite_dom
  - openbabel
  - enum_popmax
  - ml_pka
  fleiss_sets:
    all_five:
    - naive
    - dimorphite_dom
    - openbabel
    - enum_popmax
    - ml_pka
    four_families:
    - naive
    - dimorphite_dom
    - openbabel
    - ml_pka
    tools_only:
    - dimorphite_dom
    - openbabel
    - ml_pka
  charge_classes:
  - <=-2
  - '-1'
  - '0'
  - zwitterion
  - '+1'
  - '>=+2'
  original_numbers_reproduced:
    dude:
      openbabel_ne_default_frac: 0.4498
      openbabel_nonzero_frac: 0.4478
      dimorphite_has_charged_state_frac: 0.7695
      dimorphite_default_absent_frac: 0.0918
    pdbbind:
      openbabel_ne_default_frac: 0.4271
      openbabel_nonzero_frac: 0.5312
      dimorphite_has_charged_state_frac: 0.8385
      dimorphite_default_absent_frac: 0.1823
  original_enumeration_mismatch:
    dude: 0.6537
    pdbbind: 0.651
anchor:
  iupac_assessment_keep:
  - Reliable
  - Approximate
  t_min_c: 20.0
  t_max_c: 30.0
  pka_type_regex: ^(pKaH|pKa|pKb)(\d+)?$
  label_keep:
  - A
  - AH
  - B
  pkb_to_pkah_offset: 14.0
  max_cosolvent: ''
  pressure_ok:
  - ''
  - 1 (bar)
  - 1 (atm)
  max_dispersion: 1.0
  allowed_elements:
  - H
  - C
  - N
  - O
  - F
  - P
  - S
  - Cl
  - Br
  - I
  required_net_charge: 0
  druglike:
    mw_min: 150.0
    mw_max: 600.0
    min_rings: 1
    hbd_max: 5
    hba_max: 10
  require_window_constant: true
  gate_window:
  - 2.0
  - 12.0
  site_grouping: 'nitrogen sites of the same kind that share a carbon neighbour (N-C-N: amidine, guanidine, imidazole) are one ionisable group; counts are of groups'
  relevant_halfwidth: 3.0
  min_complete_n: 150
  ambiguous_below: 0.6
  coupled_gap: 2.0
  sampl_sets:
  - SAMPL6
  - SAMPL7
  - SAMPL8
  sampl_type_rule: constants of a SAMPL molecule are typed acid/base only if every independent-SMARTS site of the molecule inside the window has the same type; mixed molecules are excluded as sampl_type_unresolved
  source_priority:
  - IUPAC
  - SAMPL
  - ChEMBL
  chembl_use: only records whose activity_comment is 'Acidic pKa' or 'Basic pKa' (669 records, 503 molecules, one curated ChEMBL document); the other ~12,350 records carry no acid/base type and are not
    used (counted in anchor_build_log.json)
  chembl_relation_ok:
  - ''
  - '='
  methods:
  - naive
  - neutral_input
  - dimorphite_dom
  - openbabel
  - enum_popmax
  - ml_pka
  primary_set: complete
  variant_base_sets:
  - complete
  - complete_relaxed
  - all
  class_report_sets:
  - complete
  - complete_relaxed
  - all
  ladder_rule: constants are grouped by (molecule, direction, step); the steps of one direction must be 1..k without a gap, otherwise the molecule is excluded (reason ladder_gap or dispersion)
classes:
  priority:
  - amidine_guanidine
  - aliphatic_amine
  - carboxylic_acid
  - tetrazole_acylsulfonamide
  - imidazole_azole
  - pyridine_azine
  - aniline
  - phenol
  - sulfonamide_imide
  - none
  nominal_pka_window:
    amidine_guanidine:
    - 11.0
    - 13.6
    aliphatic_amine:
    - 8.0
    - 11.0
    carboxylic_acid:
    - 3.0
    - 5.0
    tetrazole_acylsulfonamide:
    - 4.0
    - 5.5
    imidazole_azole:
    - 5.5
    - 7.5
    pyridine_azine:
    - 2.0
    - 6.0
    aniline:
    - 2.0
    - 5.0
    phenol:
    - 8.0
    - 10.5
    sulfonamide_imide:
    - 8.0
    - 11.0
  min_n_for_class_error: 5
reweight:
  dude_composition_from: dude_tsv
  extrapolation_label: weighted extrapolation, not a measurement on DUD-E
leakage:
  tools:
  - MolGpKa
  note: MolGpKa was trained on ACD/pKa predictions for 1.6 million ChEMBL compounds (Pan et al., J. Chem. Inf. Model. 2021, 61, 3159); that training set is not public. The only public related files are
    the 19,848-molecule example mols.sdf shipped with the code and the Baltruschat et al. experimental collection used by pkasolver; overlap with both is removed as a proxy and both versions are reported.
post_freeze:
  sampl_type_check_margin: 2.0
