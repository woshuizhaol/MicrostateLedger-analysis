stats:
  seed_null: 20261014
  n_null: 10000
  seed_boot: 20261015
  n_boot: 10000
  alpha: 0.05
  null_pool_rule: ensemble members (the Dimorphite 6.4-8.4 ensemble, truncated to 24 as in D11) other than the default (single) state, with a finite score for the scorer; the draw is uniform over the pool
  null_variants:
  - non_single
  - incl_single
scorers:
- vina
- smina
- ad4
n_common_expected:
  vina: 257
  smina: 246
  ad4: 244
original_delta_expected:
  vina: 0.0142
  smina: 0.0199
  ad4: 0.0006
original_random_delta_expected:
  vina: 0.0088
  smina: 0.0077
  ad4: -0.002
validation:
  n_complexes: 20
  seed: 20261017
  tolerance: 0.01
  nproc: 20
predictors:
  list:
  - dimorphite_dom
  - openbabel
  - enum_popmax
  - ml_pka
  - consensus_ge3
  consensus_min_agree: 3
  state_rule: 'A predictor gives a net charge for the ligand. The microstate scored for it is the candidate with that net charge: candidates are the ensemble members plus the Dimorphite dominant state;
    ties are broken by the highest independent-site Henderson-Hasselbalch population (original code), then by SMILES. Dimorphite uses its own dominant state directly (as in the original analysis). If no
    candidate has the predicted net charge, the complex keeps the default state and is counted as `fallback_single`.'
  input_for_prediction: input_smiles
matched_null:
  rule: in each complex whose chosen state differs from the default, draw uniformly among candidates other than the default and the chosen state that have the same |q - q_default|; complexes with an empty
    matched pool are left unchanged in BOTH the observed and the null delta, so both compare the same set of changed complexes
anchoring:
  min_n_for_inference: 30
  match_key: inchikey_skeleton
  mcs_similarity_min: 0.8
affected_subset:
  score_change_tol: 1.0e-09
